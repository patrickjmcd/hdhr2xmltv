name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  test:
    uses: patrickjmcd/workflows/.github/workflows/go-ci.yml@v1

  # PRs: build the image without pushing.
  check:
    if: github.event_name == 'pull_request'
    uses: patrickjmcd/workflows/.github/workflows/docker-image.yml@v1
    with:
      push: false

  release:
    if: github.event_name == 'push'
    needs: test
    uses: patrickjmcd/workflows/.github/workflows/release-please.yml@v1
    with:
      release-type: go

  # main + short-SHA on every push; 1.2.3 / 1.2 / 1 / latest on a release.
  image:
    if: github.event_name == 'push'
    needs: release
    uses: patrickjmcd/workflows/.github/workflows/docker-image.yml@v1
    with:
      version: ${{ needs.release.outputs.release_created == 'true' && needs.release.outputs.tag_name || '' }}
      tags: |
        type=semver,pattern={{major}},value=${{ needs.release.outputs.tag_name }},enable=${{ needs.release.outputs.release_created == 'true' }}
